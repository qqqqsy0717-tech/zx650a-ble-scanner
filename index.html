<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ZX650A BLE Control Lab</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:18px;
    background:#f5f5f7;
    color:#111;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

h1{font-size:24px;margin:0 0 8px}
h2{font-size:18px;margin:20px 0 10px}

.panel{
    background:#fff;
    border-radius:14px;
    padding:15px;
    margin:12px 0
}

.status{
    line-height:1.8
}

.status span{
    font-weight:600
}

button{
    border:1px solid #aaa;
    background:#fff;
    border-radius:10px;
    padding:11px 13px;
    margin:4px;
    font-size:15px
}

button:active{
    transform:scale(.97)
}

.primary{
    background:#111;
    color:#fff;
    border-color:#111
}

.mode-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #aaa;
    border-radius:10px;
    font-size:15px;
    margin:5px 0
}

pre{
    background:#111;
    color:#eee;
    border-radius:12px;
    padding:12px;
    min-height:180px;
    white-space:pre-wrap;
    word-break:break-all;
    font-size:12px;
    overflow:auto
}

.note{
    color:#666;
    font-size:13px;
    line-height:1.5
}

.ready{color:green}
.notready{color:#999}
</style>
</head>

<body>

<h1>ZX650A BLE Control Lab</h1>

<div class="panel status">

    <div>
        设备：
        <span id="deviceName">未连接</span>
    </div>

    <div>
        GATT：
        <span id="gattStatus">未连接</span>
    </div>

</div>


<div class="panel">

<button class="primary" onclick="connectDevice()">
扫描并连接 ZX650A
</button>

<button onclick="disconnectDevice()">
断开
</button>

<button onclick="clearLog()">
清空日志
</button>

</div>


<div class="panel">

<h2>BLE 特征状态</h2>

<div>
FFE1：
<span id="ffe1Status" class="notready">未找到</span>
</div>

<div>
FFE2：
<span id="ffe2Status" class="notready">未找到</span>
</div>

<div>
AE01：
<span id="ae01Status" class="notready">未找到</span>
</div>

<div>
AE02：
<span id="ae02Status" class="notready">未找到</span>
</div>

<pre id="characteristics">尚未连接</pre>

</div>


<div class="panel">

<h2>吮吸模式</h2>

<p class="note">
目前候选控制帧：
<br>
55 FE 09 XX 0A 00 00
<br><br>
注意：这些是根据 Notify 得到的候选帧，目前正在验证是否也是 Write 帧。
</p>

<div class="mode-grid">

<button onclick="testSuction(1)">吮吸 1</button>
<button onclick="testSuction(2)">吮吸 2</button>
<button onclick="testSuction(3)">吮吸 3</button>
<button onclick="testSuction(4)">吮吸 4</button>

<button onclick="testSuction(5)">吮吸 5</button>
<button onclick="testSuction(6)">吮吸 6</button>
<button onclick="testSuction(7)">吮吸 7</button>
<button onclick="testSuction(8)">吮吸 8</button>

</div>

</div>


<div class="panel">

<h2>入体模式</h2>

<p class="note">
目前已观察到：
<br>
55 FE 03 XX 0A 00 00
<br>
55 FE 07 XX 0A 00 00
<br><br>
这里暂时不自动假设两条都需要 Write。
</p>

<div class="mode-grid">

<button onclick="testInsertion(1)">入体 1</button>
<button onclick="testInsertion(2)">入体 2</button>
<button onclick="testInsertion(3)">入体 3</button>
<button onclick="testInsertion(4)">入体 4</button>

<button onclick="testInsertion(5)">入体 5</button>
<button onclick="testInsertion(6)">入体 6</button>
<button onclick="testInsertion(7)">入体 7</button>
<button onclick="testInsertion(8)">入体 8</button>

</div>

</div>


<div class="panel">

<h2>原始 HEX Write</h2>

<select id="writeTarget">

<option value="FFE1">
FFE1
</option>

<option value="AE01">
AE01
</option>

</select>

<input
id="hexInput"
type="text"
placeholder="55 FE 09 01 0A 00 00">

<button class="primary" onclick="sendRawHex()">
发送 HEX
</button>

</div>


<div class="panel">

<h2>实时日志</h2>

<pre id="log">等待操作……</pre>

</div>


<script>

const UUID = {

    FFE0:"0000ffe0-0000-1000-8000-00805f9b34fb",
    FFE1:"0000ffe1-0000-1000-8000-00805f9b34fb",
    FFE2:"0000ffe2-0000-1000-8000-00805f9b34fb",

    AE00:"0000ae00-0000-1000-8000-00805f9b34fb",
    AE01:"0000ae01-0000-1000-8000-00805f9b34fb",
    AE02:"0000ae02-0000-1000-8000-00805f9b34fb"

};


let device=null;
let server=null;

let FFE1=null;
let FFE2=null;
let AE01=null;
let AE02=null;


function log(text){

    const box=document.getElementById("log");

    const time=new Date().toLocaleTimeString();

    box.textContent +=
        "["+time+"] "+text+"\n";

    box.scrollTop=box.scrollHeight;

}


function clearLog(){

    document.getElementById("log").textContent="";

}


function hexToBytes(hex){

    hex=hex
        .replace(/0x/gi,"")
        .replace(/[^0-9a-fA-F]/g,"");

    if(hex.length===0){
        throw new Error("HEX 不能为空");
    }

    if(hex.length%2!==0){
        throw new Error("HEX 长度必须为偶数");
    }

    const result=new Uint8Array(hex.length/2);

    for(let i=0;i<hex.length;i+=2){

        result[i/2]=parseInt(
            hex.substring(i,i+2),
            16
        );

    }

    return result;

}


function bytesToHex(bytes){

    return Array.from(bytes)
        .map(
            x=>x
            .toString(16)
            .padStart(2,"0")
            .toUpperCase()
        )
        .join(" ");

}


function shortUUID(uuid){

    const u=uuid.toLowerCase();

    for(const key in UUID){

        if(UUID[key]===u){
            return key;
        }

    }

    return uuid;

}


function setStatus(id,text,ready){

    const el=document.getElementById(id);

    el.textContent=text;

    el.className=ready
        ?"ready"
        :"notready";

}


function notificationHandler(event){

    const value=event.target.value;

    const bytes=new Uint8Array(
        value.buffer,
        value.byteOffset,
        value.byteLength
    );

    log(
        "[NOTIFY] "+
        shortUUID(event.target.uuid)+
        " ← "+
        bytesToHex(bytes)
    );

}


async function connectDevice(){

    try{

        FFE1=null;
        FFE2=null;
        AE01=null;
        AE02=null;

        setStatus("ffe1Status","寻找中",false);
        setStatus("ffe2Status","寻找中",false);
        setStatus("ae01Status","寻找中",false);
        setStatus("ae02Status","寻找中",false);


        log("正在请求蓝牙设备……");


        device=await navigator.bluetooth.requestDevice({

            acceptAllDevices:true,

            optionalServices:[
                UUID.FFE0,
                UUID.AE00
            ]

        });


        document.getElementById("deviceName")
            .textContent=
            device.name || "未知";


        log(
            "设备名称: "+
            (device.name || "未知")
        );


        log(
            "设备ID: "+
            device.id
        );


        device.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );


        log("正在连接 GATT……");


        server=await device.gatt.connect();


        document.getElementById("gattStatus")
            .textContent="已连接";


        log(
            "GATT 已连接: "+
            server.connected
        );


        await discover();


    }catch(error){

        log(
            "[ERROR] "+
            error.name+
            " — "+
            error.message
        );

    }

}


async function discover(){

    const output=
        document.getElementById(
            "characteristics"
        );

    output.textContent="";


    const services=
        await server.getPrimaryServices();


    log("========== SERVICES ==========");


    for(const service of services){

        const serviceName=
            shortUUID(service.uuid);


        output.textContent+=
            "Service: "+
            serviceName+
            "\n";


        log(
            "Service: "+
            serviceName
        );


        const chars=
            await service.getCharacteristics();


        for(const char of chars){

            const name=
                shortUUID(char.uuid);


            const props=[];


            if(char.properties.read)
                props.push("read");

            if(char.properties.write)
                props.push("write");

            if(char.properties.writeWithoutResponse)
                props.push("writeWithoutResponse");

            if(char.properties.notify)
                props.push("notify");

            if(char.properties.indicate)
                props.push("indicate");


            output.textContent+=
                "  Characteristic: "+
                name+
                "\n"+
                "    Properties: "+
                props.join(", ")+
                "\n";


            log(
                "  Characteristic: "+
                name
            );

            log(
                "    Properties: "+
                props.join(", ")
            );


            /*
             * 这里直接按照 UUID 保存
             * 不再使用之前有问题的对象映射
             */

            if(name==="FFE1"){

                FFE1=char;

                setStatus(
                    "ffe1Status",
                    "READY",
                    true
                );

            }


            if(name==="FFE2"){

                FFE2=char;

                setStatus(
                    "ffe2Status",
                    "READY",
                    true
                );

            }


            if(name==="AE01"){

                AE01=char;

                setStatus(
                    "ae01Status",
                    "READY",
                    true
                );

            }


            if(name==="AE02"){

                AE02=char;

                setStatus(
                    "ae02Status",
                    "READY",
                    true
                );

            }


            if(
                char.properties.notify
            ){

                try{

                    await char.startNotifications();

                    char.addEventListener(
                        "characteristicvaluechanged",
                        notificationHandler
                    );


                    log(
                        "    >>> Notify 已开启"
                    );


                }catch(error){

                    log(
                        "    >>> Notify 开启失败: "+
                        error.message
                    );

                }

            }

        }

    }


    output.textContent+=
        "\n========== READY ==========\n";


    log(
        "========== 监听中 =========="
    );

}


async function writeCharacteristic(
    characteristic,
    name,
    hex
){

    if(!characteristic){

        log(
            "[ERROR] 找不到 "+
            name+
            "，请先连接设备"
        );

        return false;

    }


    try{

        const bytes=hexToBytes(hex);


        log(
            "[WRITE] "+
            name+
            " → "+
            bytesToHex(bytes)
        );


        if(
            characteristic.properties
                .writeWithoutResponse
        ){

            await characteristic
                .writeValueWithoutResponse(
                    bytes
                );

        }else if(
            characteristic.properties.write
        ){

            await characteristic
                .writeValue(bytes);

        }else{

            throw new Error(
                "该特征不支持 Write"
            );

        }


        log(
            "[WRITE OK] "+
            name
        );


        return true;


    }catch(error){

        log(
            "[WRITE ERROR] "+
            name+
            " — "+
            error.name+
            " — "+
            error.message
        );


        return false;

    }

}


async function testSuction(mode){

    const hex=
        "55 FE 09 "+
        mode.toString(16)
            .padStart(2,"0")
            .toUpperCase()+
        " 0A 00 00";


    log(
        "========== 吮吸 "+
        mode+
        " 候选测试 =========="
    );


    log(
        "候选帧: "+
        hex
    );


    await writeCharacteristic(
        FFE1,
        "FFE1",
        hex
    );

}


async function testInsertion(mode){

    const m=
        mode.toString(16)
            .padStart(2,"0")
            .toUpperCase();


    /*
     * 目前先只测试 03。
     *
     * 因为我们知道：
     *
     * 03 和 07 是设备 Notify
     *
     * 但不知道两条是否都需要手机 Write。
     */


    const hex=
        "55 FE 03 "+
        m+
        " 0A 00 00";


    log(
        "========== 入体 "+
        mode+
        " 候选测试 =========="
    );


    log(
        "候选帧: "+
        hex
    );


    await writeCharacteristic(
        FFE1,
        "FFE1",
        hex
    );

}


async function sendRawHex(){

    const target=
        document.getElementById(
            "writeTarget"
        ).value;


    const input=
        document.getElementById(
            "hexInput"
        ).value
        .trim();


    if(!input){

        log(
            "[ERROR] HEX 不能为空"
        );

        return;

    }


    const characteristic=
        target==="FFE1"
        ?FFE1
        :AE01;


    await writeCharacteristic(
        characteristic,
        target,
        input
    );

}


function disconnectDevice(){

    if(
        device &&
        device.gatt &&
        device.gatt.connected
    ){

        device.gatt.disconnect();

    }

}


function onDisconnected(){

    document.getElementById(
        "gattStatus"
    ).textContent="已断开";


    setStatus(
        "ffe1Status",
        "未连接",
        false
    );

    setStatus(
        "ffe2Status",
        "未连接",
        false
    );

    setStatus(
        "ae01Status",
        "未连接",
        false
    );

    setStatus(
        "ae02Status",
        "未连接",
        false
    );


    FFE1=null;
    FFE2=null;
    AE01=null;
    AE02=null;


    log(
        "设备已断开"
    );

}

</script>

</body>
</html>
